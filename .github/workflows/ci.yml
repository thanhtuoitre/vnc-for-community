name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  windows-server:
    name: Build & Test Windows VNC Server
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore server/VncServer.sln

      - name: Build & Run Server Tests
        run: dotnet test server/VncServer.sln -c Release --verbosity normal

  android-client:
    name: Build & Test Android VNC Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x client/gradlew

      - name: Run Client Unit Tests
        run: cd client && ./gradlew test

      - name: Assemble Debug APK
        run: cd client && ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: client/app/build/outputs/apk/debug/app-debug.apk
